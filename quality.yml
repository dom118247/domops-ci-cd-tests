name: Quality Gate

on:
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # CONFIGURE

      - name: Install dependencies
        run: pip install pytest pytest-cov # CONFIGURE: add packages your project needs

      - name: Run tests and generate coverage report
        env:
          # CONFIGURE: add environment variables your project needs
          EXAMPLE_VAR: example_value
        run: pytest tests/ --cov --cov-report=xml # CONFIGURE: update test path

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Add this as a secret in each repo's GitHub settings
