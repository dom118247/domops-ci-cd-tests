name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # CONFIGURE: match your project's Python version

      - name: Install dependencies
        run: pip install pytest pytest-cov # CONFIGURE: add packages your project needs

      - name: Run tests
        env:
          # CONFIGURE: add environment variables your project needs
          EXAMPLE_VAR: example_value
        run: pytest tests/ -v --cov --cov-report=term-missing # CONFIGURE: update test path
