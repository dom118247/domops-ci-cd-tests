name: Integration Tests

on:
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - "4566:4566"
        env:
          SERVICES: s3,secretsmanager,lambda # CONFIGURE: add the AWS services your project uses

      postgres:
        image: postgres:16 # CONFIGURE: remove if your project doesn't use PostgreSQL
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: testdb           # CONFIGURE
          POSTGRES_USER: testuser       # CONFIGURE
          POSTGRES_PASSWORD: testpassword # CONFIGURE

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # CONFIGURE

      - name: Install dependencies
        run: pip install pytest # CONFIGURE: add packages your project needs

      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: eu-west-2  # CONFIGURE
          AWS_ENDPOINT_URL: http://localhost:4566
          # CONFIGURE: add any other env vars your project needs
        run: pytest integration-tests/ -v # CONFIGURE: update test path
